<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'" />
    <title>TTD Settings</title>
    <link rel="icon" href="../assets/icons/favicon-32.png" />
    <style>
      :root {
        --bg: #0f0f0f;
        --card: #1c1c1c;
        --line: #2e2e2e;
        --text: #f1f1f1;
        --muted: #aaaaaa;
        --accent: #ff3b30;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", Roboto, Arial, sans-serif; }
      header { display: flex; align-items: center; gap: 12px; padding: 20px 24px 16px; }
      header img { width: 32px; height: 32px; }
      h1 { margin: 0; font-size: 20px; font-weight: 600; }
      .kofi { margin-left: auto; padding: 6px 12px; border-radius: 16px; background: #72a4f2; color: #fff; font-weight: 600; font-size: 13px; text-decoration: none; }
      .kofi:hover { background: #5b90e6; }
      main { padding: 0 24px 24px; display: grid; gap: 12px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
      .head { display: flex; align-items: flex-start; gap: 12px; }
      .head .text { flex: 1; }
      .name { font-weight: 600; font-size: 15px; }
      .name, .field .label { display: flex; align-items: center; gap: 6px; }
      .hint { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%;
        border: 1px solid var(--muted); color: var(--muted); font: italic 600 10px Georgia, serif; cursor: help; flex: none; }
      .hint:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .fields { display: grid; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
      .fields:empty { display: none; }
      .field { display: grid; grid-template-columns: 1fr 220px; align-items: center; gap: 12px; }
      .field label { color: var(--text); }
      input[type="number"], select, textarea {
        width: 100%; background: #121212; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit;
      }
      textarea { min-height: 70px; resize: vertical; }
      textarea.code { font: 12px/1.4 Consolas, "Cascadia Mono", monospace; min-height: 120px; }
      .card.off .fields { opacity: 0.45; pointer-events: none; }
      /* switch */
      .switch { position: relative; width: 40px; height: 22px; flex: none; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .switch span { position: absolute; inset: 0; background: #444; border-radius: 22px; transition: background .15s; cursor: pointer; }
      .switch span::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .15s; }
      .switch input:checked + span { background: var(--accent); }
      .switch input:checked + span::before { transform: translateX(18px); }
      .switch input:focus-visible + span { outline: 2px solid #fff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <header>
      <img src="../assets/icons/favicon-64.png" alt="" />
      <h1>The Tube Desktop — Settings</h1>
      <a id="kofi" class="kofi" href="#">♥ Support TTD on Ko-fi</a>
    </header>
    <main id="plugins"></main>
    <script src="../dist/settings/renderer.js"></script>
  </body>
</html>
